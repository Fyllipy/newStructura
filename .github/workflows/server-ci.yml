name: server-ci
on:
  push:
    paths: ["server/**", ".github/workflows/server-ci.yml", "SPEC.md", "PLAN.md"]
  pull_request:
    paths: ["server/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Dependencias vulneraveis (gratuito)
      - run: pip install pip-audit && pip-audit -r server/requirements.txt
      # SAST (gratuito)
      - run: pip install semgrep && semgrep scan --config p/python --config p/owasp-top-ten --error server/app
      # Segredos no historico (gratuito)
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      # Vulnerabilidades/misconfig em FS e IaC (gratuito)
      - uses: aquasecurity/trivy-action@0.24.0
        with: { scan-type: fs, scan-ref: server, severity: "CRITICAL,HIGH", exit-code: "1" }
